name: Weekly benchmark update

on:
  schedule:
    # 00:00 UTC every Monday
    - cron: "0 0 * * 1"
  # allow manually triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate characteristics and READMEs
        run: python cli.py update

      - name: Compute date tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit"
          else
            git commit -m "update: ${{ steps.date.outputs.date }} weekly check"
            git push
          fi
